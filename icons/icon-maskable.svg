<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icona di JARVIS · Compagno di studio: nucleo energetico con anelli, sui colori dell'app -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#0F2E52"/>
      <stop offset="0.55" stop-color="#071A30"/>
      <stop offset="1" stop-color="#030B16"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C8FF" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#1677FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00C8FF" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00C8FF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#00A6FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00C8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F4FCFF"/>
      <stop offset="0.1" stop-color="#9BEBFF"/>
      <stop offset="0.36" stop-color="#19B9FF"/>
      <stop offset="0.66" stop-color="#0C5FD6"/>
      <stop offset="0.9" stop-color="#082C5C"/>
      <stop offset="1" stop-color="#062347"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">

  <circle cx="256" cy="256" r="190" fill="url(#glow)"/>

  <!-- anelli -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="#00C8FF" stroke-opacity="0.28" stroke-width="3"/>
  <circle cx="256" cy="256" r="156" fill="none" stroke="#00C8FF" stroke-opacity="0.5" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="140" stroke="#00C8FF" stroke-width="11" stroke-dasharray="220 660" transform="rotate(-128 256 256)" filter="url(#soft)" opacity="0.9"/>
    <circle cx="256" cy="256" r="140" stroke="#7FE6FF" stroke-width="7" stroke-dasharray="220 660" transform="rotate(-128 256 256)"/>
    <circle cx="256" cy="256" r="140" stroke="#00C8FF" stroke-width="5" stroke-dasharray="95 785" transform="rotate(62 256 256)" opacity="0.75"/>
    <circle cx="256" cy="256" r="178" stroke="#1677FF" stroke-width="6" stroke-dasharray="120 999" transform="rotate(18 256 256)" opacity="0.9"/>
  </g>

  <!-- nucleo -->
  <circle cx="256" cy="256" r="120" fill="#00C8FF" opacity="0.35" filter="url(#soft)"/>
  <circle cx="256" cy="256" r="106" fill="url(#orb)"/>
  <circle cx="256" cy="256" r="106" fill="none" stroke="#9BEBFF" stroke-opacity="0.55" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="72" fill="none" stroke="#E8FAFF" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="256" cy="256" r="42" fill="none" stroke="#E8FAFF" stroke-opacity="0.16" stroke-width="2"/>
  <ellipse cx="222" cy="205" rx="40" ry="23" fill="#FFFFFF" opacity="0.16" transform="rotate(-28 226 212)"/>
  </g>
</svg>
